services:
  # ── NestJS 애플리케이션 ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: batchar-api:local
    container_name: batchar-api
    env_file: .env # JWT / S3 / MAIL / MYSQL_USER 등 모든 값 주입
    environment:
      TZ: Asia/Seoul
      # 컨테이너 간 통신은 서비스 이름 + 내부 포트 사용 (.env의 localhost/13306 값을 덮어씀)
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "18080:18080"
    depends_on:
      mysql:
        condition: service_healthy # mysql이 healthy 된 뒤에 app 기동
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── MySQL ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: batchar-mysql
    env_file: .env
    environment:
      TZ: Asia/Seoul
    ports:
      - "13306:3306" # 호스트(맥)에서 직접 붙을 때 쓰는 포트
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: batchar-redis
    environment:
      TZ: Asia/Seoul
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
